[Mod]
Name=Spear
Version=0.2
Author=Zabk
Description=SPEAR, a campaign of its own on the main menu's GAME MODES. Mission 1: the 205th Marauders' formation exercise off Mars, cut short as the war comes back. Mission 2: Forte San Marco, silent in outer Earth orbit, and its evacuation under fire.
OpenReliant=0.21
Requires=realistic-planets

[Scripts]
Menu=menu.luau

[Missions]
mission301.dte=landing.luau, cinematic.luau, wing.luau, nanny.luau, campaign.luau
mission302.dte=landing.luau, wing2.luau, campaign.luau

; The 205th Marauders' pilots. Each wears the face of one of the game's own Marauders (pilots 186
; and 187 in the game, films Marauders_Plt and MarauderWL_Plt in pilots.hog), but is based on a 45th
; pilot's record: pilotstats.bin holds 124 records, and OpenReliant gives a pilot based on one past
; them a record of zeros, whose pilot never answers What's your status?. Corsair is based on record
; 0, the Tigers' wing leader, a skilled pilot; the rest on record 5, the 45th's plain pilot. The
; game's Marauders have no voice of their own either, so each pilot speaks with one of the game's
; allied voices, which have the answers to the wing's commands and the other radio lines: men's
; voices for the men (Face, Juice, Ego, Nero; Fahrenheit has Juice's, whose lines sound cleaner than
; Cutter's) and women's for Pitbull and Stardust (Rhino, Flash). Rook and Mako, new in mission 2,
; have Cutter's and Flash's. The numbers after the names are the ones the mod's missions give their
; ships' pilots; a mission's pilot number stays below 255.
